<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: false }; this._timer = null; this._link = null; }
  componentWillUnmount() { if (this._timer) clearTimeout(this._timer); }
  enter() {
    if (this._went) return;
    if (this._timer) clearTimeout(this._timer);
    const a = this._link || (typeof document !== 'undefined' && document.querySelector('a[data-enter="1"]'));
    if (!a) return;
    this._went = true;
    try { a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); } catch (e) { a.click(); }
  }
  chime() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const t = ctx.currentTime;
      const tone = (f, start, dur, type, vol) => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + start);
        g.gain.exponentialRampToValueAtTime(vol, t + start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t + start); o.stop(t + start + dur + 0.05);
      };
      tone(1046.5, 0, 0.09, 'square', 0.05);
      [196.0, 293.66, 392.0, 493.88, 587.33].forEach((f, i) => tone(f, 0.18 + i * 0.012, 2.4, 'triangle', 0.09));
      [0.9, 1.25, 1.5, 1.9].forEach((s) => tone(80 + Math.random() * 40, s, 0.06, 'square', 0.03));
    } catch (e) {}
  }
  renderVals() {
    const on = this.state.on;
    return {
      isOn: on, isOff: !on,
      ledClass: on ? 'led led-on' : 'led',
      powerLabel: on ? 'Turn the computer off' : 'Turn the computer on',
      setLink: (el) => { this._link = el; },
      done: () => this.enter(),
      power: () => {
        if (on) { if (this._timer) clearTimeout(this._timer); this.setState({ on: false }); return; }
        this.chime();
        this._went = false;
        this.setState({ on: true });
        this._timer = setTimeout(() => this.enter(), 5400);
      }
    };
  }
}
</script>
<script src="assets/runtime.js"></script>
</body>
</html>
