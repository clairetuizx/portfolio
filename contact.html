.browser .chrome i{width:8px;height:8px;border-radius:50%;border:1.5px solid #2B2220;background:#fff}
.browser img,.browser video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:#111}

@media (max-width:700px){
.fold img{max-width:100%;height:auto !important}
.navlinks{flex-wrap:nowrap !important;overflow-x:auto;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.navlinks::-webkit-scrollbar{display:none}
.navlinks{gap:0 !important}
header nav{padding:4px 10px !important}
.fold-paper li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block !important}
.navlink{white-space:nowrap;padding:8px 6px;font-size:11px;letter-spacing:0}
.deco-win{transform:scale(.6);transform-origin:top left;top:90px !important}
.deco-note{transform:scale(.62) rotate(3deg) !important;transform-origin:top right;top:110px !important}
.dd-menu{display:none !important}
.tabrow{flex-wrap:wrap !important;gap:8px !important;padding:2px 0 8px}
.tabrow::-webkit-scrollbar{display:none}
.tabrow .tab{white-space:nowrap;flex:0 0 auto;font-size:16px !important;padding:0 12px !important;min-height:42px !important;height:auto !important}
[style*="padding: 72px 24px"]{padding-top:36px !important;padding-bottom:28px !important}
[style*="padding: 80px 24px"]{padding-top:36px !important}
[style*="padding: 40px 24px 96px"],[style*="padding: 32px 24px 96px"],[style*="padding: 56px 24px 96px"]{padding-bottom:56px !important}
.foldgrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:28px 14px !important}
.fold,button.fold{height:236px !important}
.fold-paper{left:10px !important;right:10px !important;top:44px !important;padding:8px 10px !important}
.fold-paper.p2{left:18px !important;right:4px !important}
.fold-paper ul{font-size:11px !important}
.fold-front,button.fold .fold-front{min-height:168px !important;padding:14px !important;gap:8px !important}
.fold-front svg{width:44px !important;height:auto !important}
.fold-front > span:first-child > span,.fold-front > span:first-child > img{width:44px !important;height:44px !important}
.fold-open{white-space:nowrap;font-size:9px !important}
.fold-front > span:first-child{height:40px !important}
.ftitle{font-size:24px !important}
.deco{display:none !important}
.fold-paper{height:150px !important;overflow:hidden}
.fdesc{display:none !important}
.fold-tab{height:26px !important}
.fold-back{top:24px !important}
.bigscene{overflow-x:auto !important}
.btn{font-size:19px}
h1{overflow-wrap:anywhere}
}

@container room (max-width:999px){.stage{zoom:.8 !important}.desk1{height:240px !important}}
@container room (max-width:799px){.stage{zoom:.7 !important;margin-left:calc((100cqw - 700px) / 1.4) !important}.desk1{height:210px !important}}
@container room (max-width:479px){.stage{zoom:.62 !important;margin-left:calc((100cqw - 620px) / 1.24) !important}.desk1{height:186px !important}}
</style>
